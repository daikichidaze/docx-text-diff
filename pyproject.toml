[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-text-diff"
version = "0.1.0"
description = "Create a Word tracked-changes DOCX by comparing two DOCX files with Microsoft Word."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "docx-text-diff contributors" }
]
dependencies = [
  "pywin32>=306; platform_system == 'Windows'"
]

[project.optional-dependencies]
dev = [
  "pytest>=8"
]

[project.scripts]
docx-text-diff = "docx_diff_track.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "windows_word: requires Windows with Microsoft Word installed"
]
